function catalogHTML(){return '<div class="heading"><div><div class="eyebrow">TU PRÓXIMA VENTA EMPIEZA AQUÍ</div><h1>Todo para construir. Listo para vender.</h1><p>Un catálogo conectado a cada oportunidad.</p></div><button class="btn light" onclick="startGuide()">▷ Recorrido guiado</button></div>'+guideHTML()+'<section class="hero"><div><div class="eyebrow">AKABADOS × FERMACOL</div><h2>Del proyecto de tu cliente<br>al pedido perfecto.</h2><p>Encuentra el acabado ideal, calcula cantidades y toma pedidos desde donde estés.</p><button class="btn lime small" onclick="document.getElementById(\'search\').focus()">Explorar colección ↗</button></div><div class="heroArt"><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="floating"><span class="dot"></span>Catálogo y stock en un solo lugar</div></div></section><div class="stats"><div class="stat"><small>Pedido actual</small><b>'+money(totals().total)+'</b><small>Incluye IVA demo 15%</small></div><div class="stat"><small>Cliente seleccionado</small><b style="font-size:17px">'+client().name+'</b><small>'+client().type+' · '+client().term+'</small></div><div class="stat"><small>Condición comercial</small><b>'+Math.round(client().discount*100)+'% <span style="font-size:11px;font-weight:400">tarifa cliente</span></b><small class="up">Aplicada automáticamente · demo</small></div><div class="stat"><small>Disponibilidad</small><b style="font-size:17px">'+(online?'Consulta activa':'Sin conexión')+'</b><small>'+ (warehouse===0?'Primera Imprenta':'Izamba')+' · stock simulado</small></div></div><div class="workspace"><section><div class="sectionTitle"><h2>Catálogo de productos <small style="font-size:11px" id="resultCount"></small></h2><button class="btn light small" onclick="settings()">⚙ Configurar venta</button></div><div class="searchRow"><input id="search" aria-label="Buscar productos" placeholder="Buscar producto, código o acabado…" value="'+escapeHTML(query)+'" oninput="query=this.value;renderProducts()"><select aria-label="Filtrar marca" onchange="brand=this.value;renderProducts()"><option '+(brand==='Todas'?'selected':'')+'>Todas</option><option '+(brand==='Akabados'?'selected':'')+'>Akabados</option><option '+(brand==='Fermacol'?'selected':'')+'>Fermacol</option></select></div><div class="filters">'+['Todos','Pisos y revestimientos','Baños y grifería','Construcción','Herramientas','Pinturas'].map(c=>'<button class="chip '+(category===c?'active':'')+'" onclick="category=\''+c+'\';render()">'+c+'</button>').join('')+'</div><div class="grid" id="products"></div><p class="tiny">Nombres de productos de referencia y surtido ilustrativo. Texturas e ilustraciones conceptuales; precios, existencias y condiciones ficticios.</p></section>'+cartHTML()+'</div>'+footer()+(cart.length?'<button class="btn mobileCart" onclick="document.getElementById(\'cart\').scrollIntoView({behavior:\'smooth\'})"><span>Ver pedido · '+cart.length+' productos</span><strong>'+money(totals().total)+' →</strong></button>':'')}
function renderProducts(){let filtered=products.filter(p=>(category==='Todos'||p.cat===category)&&(brand==='Todas'||p.brand===brand)&&[p.name,p.spec,p.sku].join(' ').toLowerCase().includes(query.toLowerCase()));document.getElementById('resultCount').textContent='· '+filtered.length+' referencias';document.getElementById('products').innerHTML=filtered.length?filtered.map(p=>'<article class="product">'+visual(p)+'<div class="productInfo"><div class="sku">'+p.brand.toUpperCase()+' / '+p.sku+'</div><h3>'+p.name+'</h3><small style="font-size:10px">'+p.spec+'</small><div class="stock '+(p.stock[warehouse]===0?'none':p.stock[warehouse]<10?'low':'')+'">● '+(p.stock[warehouse]===0?'Sin stock en esta bodega':p.stock[warehouse]+' '+(p.coverage?'cajas':({unidad:'unidades',saco:'sacos',bolsa:'bolsas',galón:'galones',kit:'kits'}[p.unit]||p.unit))+' disponibles')+'</div><div class="priceRow"><span class="price">'+money(price(p))+' <span class="unit">/ '+p.unit+'</span></span><button aria-label="Ver '+p.name+'" class="plus" onclick="detail('+p.id+')">+</button></div></div></article>').join(''):'<div class="empty">No encontramos productos. Prueba otra búsqueda.</div>'}
function cartHTML(){let t=totals();return '<aside class="panel cart" id="cart"><div class="cartHead"><h2>Tu pedido</h2><span class="count">'+cart.length+' ref.</span></div><div class="clientBox"><div style="display:flex;justify-content:space-between"><strong>'+client().name+'</strong><button class="remove" onclick="settings()">Cambiar</button></div><small>'+client().type+' · '+client().term+' · '+mode+'</small></div><div class="cartLines">'+(cart.length?cart.map(l=>{let p=pby(l.id);return '<div class="cartLine"><h4>'+p.name+'</h4><small style="font-size:10px">'+(p.coverage?l.qty+' cajas · '+(l.qty*p.coverage).toFixed(2)+' m²':l.qty+' '+p.unit)+' · '+money(price(p))+'/'+p.unit+'</small><div class="qtyRow"><div class="qty"><button aria-label="Restar '+p.name+'" onclick="quantity('+p.id+',-1)">−</button><span>'+l.qty+'</span><button aria-label="Sumar '+p.name+'" onclick="quantity('+p.id+',1)">+</button></div><b style="font-size:12px">'+money(lineTotal(l))+'</b><button class="remove" aria-label="Eliminar '+p.name+'" onclick="removeLine('+p.id+')">×</button></div></div>'}).join(''):'<div class="empty"><span class="emptyIcon">▧</span>El próximo proyecto empieza<br>con el primer producto.</div>')+'</div><div class="totals"><div class="totalRow"><span>Subtotal sin IVA</span><span>'+money(t.sub)+'</span></div>'+(discount?'<div class="totalRow"><span>Descuento adicional '+discount+'%</span><span>−'+money(t.disc)+'</span></div>':'')+'<div class="totalRow"><span>IVA demo (15%)</span><span>'+money(t.vat)+'</span></div><div class="totalRow big"><span>Total</span><span>'+money(t.total)+'</span></div></div><button class="btn full" '+(!cart.length?'disabled':'')+' onclick="checkout()">Revisar pedido →</button><div style="display:flex;justify-content:space-between;margin:12px 0"><button class="remove" onclick="saveDraft()">Guardar borrador</button><button class="remove" onclick="cart=[];save();render()">Vaciar pedido</button></div><p class="tiny">La disponibilidad se revalida al enviar. El flete se cotiza por separado. No se realiza ningún cobro.</p></aside>'}
function quantity(id,d){let l=cart.find(x=>x.id===id);if(!l)return;if(l.qty+d>pby(id).stock[warehouse]&&online){toast('Cantidad superior al stock simulado de esta bodega.');return}l.qty+=d;if(l.qty<=0)cart=cart.filter(x=>x.id!==id);save();render()}function removeLine(id){cart=cart.filter(x=>x.id!==id);save();render()}
function openModal(html,narrow=false){document.getElementById('modalRoot').innerHTML='<div class="overlay" onclick="if(event.target===this)closeModal()"><section role="dialog" aria-modal="true" aria-label="Detalle de demo" class="modal '+(narrow?'narrow':'')+'"><button class="close noPrint" aria-label="Cerrar" onclick="closeModal()">×</button>'+html+'</section></div>';document.querySelector('.modal .close').focus()}function closeModal(){document.getElementById('modalRoot').innerHTML=''}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function detail(id){let p=pby(id);openModal('<div class="eyebrow">'+p.brand+' / '+p.sku+'</div><h2>'+p.name+'</h2><p style="color:var(--muted);margin-top:0">'+p.spec+'</p><div class="two"><div class="detailVisual">'+visual(p)+'<div class="infoList"><div><span>Primera Imprenta</span><b>'+p.stock[0]+' '+(p.coverage?'cajas':p.unit)+'</b></div><div><span>Izamba</span><b>'+p.stock[1]+' '+(p.coverage?'cajas':p.unit)+'</b></div></div><p class="tiny">Existencias simuladas. Bodega activa: '+(warehouse===0?'Primera Imprenta':'Izamba')+'. '+(p.coverage?'Tono y calibre: confirmar en implementación.':'')+'</p></div><div><div class="price" style="font-size:28px">'+money(price(p))+' <span class="unit">/ '+p.unit+' sin IVA</span></div><p class="tiny">Tarifa '+client().type+' · '+Math.round(client().discount*100)+'% aplicado</p>'+(p.coverage?'<div class="calc"><b>Calcula tu proyecto</b><label for="area">Superficie requerida (m²)</label><input id="area" type="number" min="0.01" max="100000" value="30" oninput="calculate('+id+')"><label for="waste">Desperdicio adicional</label><select id="waste" onchange="calculate('+id+')"><option value="0">Sin adicional</option><option value="5">5%</option><option value="10" selected>10% recomendado para demo</option><option value="15">15%</option></select><div class="calcResult" id="calcResult"></div></div>':'')+'<label for="detailQty">Cantidad de '+(p.coverage?'cajas completas':({unidad:'unidades',saco:'sacos',bolsa:'bolsas',galón:'galones',kit:'kits'}[p.unit]||p.unit))+'</label><input id="detailQty" type="number" min="1" step="1" value="1" oninput="updateDetailTotal('+id+')"><p id="detailTotal"></p><button class="btn full" onclick="addFromDetail('+id+')">Agregar al pedido +</button><p class="tiny">Los precios y conversiones de este demo deben validarse con el catálogo maestro.</p></div></div>');if(p.coverage)calculate(id);else updateDetailTotal(id)}
function calculate(id){let p=pby(id),a=Number(document.getElementById('area').value),w=Number(document.getElementById('waste').value),q=Math.ceil(a*(1+w/100)/p.coverage);document.getElementById('calcResult').innerHTML=a>0&&Number.isFinite(q)?'<b>'+q+' cajas</b> · '+(q*p.coverage).toFixed(2)+' m² suministrados<br><small>'+p.coverage+' m²/caja · redondeo a caja completa</small>':'Ingresa una superficie válida.';document.getElementById('detailQty').value=a>0?q:1;updateDetailTotal(id)}
function updateDetailTotal(id){let p=pby(id),q=Number(document.getElementById('detailQty').value);document.getElementById('detailTotal').innerHTML='Subtotal sin IVA: <b>'+money(price(p)*(p.coverage||1)*q)+'</b>'}
function addFromDetail(id){let q=Number(document.getElementById('detailQty').value),p=pby(id),existing=cart.find(l=>l.id===id);if(!Number.isInteger(q)||q<1){toast('Ingresa una cantidad entera mayor a cero.');return}if(online&&q+(existing?.qty||0)>p.stock[warehouse]){toast('Stock insuficiente. Reduce la cantidad o cambia de bodega.');return}if(existing)existing.qty+=q;else cart.push({id,qty:q});save();closeModal();render();toast(p.name+' agregado al pedido')}
function settings(){openModal('<div class="eyebrow">CONDICIONES DE VENTA</div><h2>Cada cliente, su experiencia.</h2><label for="mode">Experiencia</label><select id="mode"><option '+(mode==='Vendedor'?'selected':'')+'>Vendedor</option><option '+(mode==='Cliente B2B'?'selected':'')+'>Cliente B2B</option><option '+(mode==='Cliente B2C'?'selected':'')+'>Cliente B2C</option></select><label for="clientSelect">Cliente de demostración</label><select id="clientSelect">'+clients.map(c=>'<option value="'+c.id+'" '+(clientId===c.id?'selected':'')+'>'+c.name+' · '+c.type+'</option>').join('')+'</select><label for="warehouse">Bodega de despacho</label><select id="warehouse"><option value="0" '+(!warehouse?'selected':'')+'>Primera Imprenta</option><option value="1" '+(warehouse?'selected':'')+'>Izamba</option></select><label for="discount">Descuento adicional solicitado (%)</label><input id="discount" type="number" min="0" max="30" value="'+discount+'"><p class="tiny">Más de 5% genera aprobación comercial. Regla ilustrativa.</p><label for="network">Conectividad simulada</label><select id="network"><option value="on" '+(online?'selected':'')+'>En línea · simulación</option><option value="off" '+(!online?'selected':'')+'>Sin conexión · guardar borradores</option></select><button class="btn full" style="margin-top:20px" onclick="applySettings()">Aplicar condiciones</button><p class="tiny">Selector de roles exclusivo de la demo. En producción cada usuario tendría permisos y acceso propios.</p>',true)}
function applySettings(){let d=Number(document.getElementById('discount').value);if(!Number.isFinite(d)||d<0||d>30){toast('El descuento debe estar entre 0 y 30%.');return}mode=document.getElementById('mode').value;clientId=Number(document.getElementById('clientSelect').value);if(mode==='Cliente B2C')clientId=3;if(mode==='Cliente B2B'&&clientId===3)clientId=1;warehouse=Number(document.getElementById('warehouse').value);discount=d;online=document.getElementById('network').value==='on';closeModal();render();toast('Precios y condiciones actualizados para '+client().name)}
function saveDraft(){if(!cart.length){toast('Agrega al menos un producto.');return}storeOrder('Borrador');cart=[];save();render();toast('Borrador guardado en este dispositivo')}
function storeOrder(status,extra={}){let c=client(),t=totals();let o={id:'DEMO-'+String(Date.now()).slice(-7),date:new Date().toLocaleDateString('es-EC'),client:c.name,clientId,warehouse,discount,total:t.total,lines:JSON.parse(JSON.stringify(cart)),status,...extra};orders.unshift(o);save();return o}
function checkout(){if(!cart.length)return;let t=totals(),c=client();openModal('<div class="eyebrow">ÚLTIMO PASO / REVISIÓN</div><h2>Un pedido listo para avanzar.</h2><p>'+c.name+' · '+c.type+' · '+c.term+'</p><div class="two"><div><label for="delivery">Modalidad de entrega</label><select id="delivery"><option>Despacho a dirección del cliente</option><option>Retiro en bodega</option></select><label for="address">Dirección / referencia</label><input id="address" maxlength="200" value="'+escapeHTML(c.address)+'"><label for="note">Observaciones</label><textarea id="note" maxlength="500" placeholder="Horario, contacto o instrucciones de entrega"></textarea><label><input id="simulateConflict" type="checkbox" style="width:auto"> Simular cambio de stock al enviar</label><p class="tiny">El flete se cotiza por separado. No se procesa pago ni se envía un pedido real.</p></div><div class="panel" style="background:#f7f8f3"><h3 style="font-size:15px">Resumen comercial</h3>'+cart.map(l=>'<div class="totalRow"><span>'+pby(l.id).name+' × '+l.qty+'</span><b>'+money(lineTotal(l))+'</b></div>').join('')+'<hr style="border:0;border-top:1px solid var(--line)"><div class="totalRow"><span>Descuento adicional</span><span>−'+money(t.disc)+'</span></div><div class="totalRow"><span>IVA demo 15%</span><span>'+money(t.vat)+'</span></div><div class="totalRow big"><span>Total</span><span>'+money(t.total)+'</span></div><p class="tiny">'+(c.type==='B2B'?'Cupo disponible simulado: '+money(creditAvailable(c)):'Condición: contado. Sin cobro real.')+'</p><button class="btn full" id="submitOrder" onclick="submitOrder()">'+(online?'Validar y enviar pedido':'Guardar borrador sin conexión')+' →</button></div></div>')}
function submitOrder(){let address=document.getElementById('address').value.trim(),note=document.getElementById('note').value.trim(),delivery=document.getElementById('delivery').value;if(!address){toast('Completa la dirección o referencia de retiro.');return}if(!online){storeOrder('Borrador',{address,note,delivery});cart=[];save();closeModal();view('orders');toast('Guardado localmente. Revalidar al recuperar conexión.');return}let insufficient=cart.find(l=>l.qty>pby(l.id).stock[warehouse]);if(document.getElementById('simulateConflict').checked||insufficient){let l=insufficient||cart[0],p=pby(l.id),available=insufficient?p.stock[warehouse]:Math.max(0,l.qty-2);conflict={id:l.id,available,address,note,delivery};openModal('<div class="eyebrow">REVALIDACIÓN DE DISPONIBILIDAD</div><h2>El stock ha cambiado.</h2><p>Otra venta consumió parte de <b>'+p.name+'</b>. Simulamos el caso antes de confirmar.</p><div class="infoList"><div><span>Solicitado</span><b>'+l.qty+'</b></div><div><span>Disponible ahora</span><b>'+available+'</b></div></div><button class="btn full" onclick="resolveConflict()">'+(available?'Ajustar a '+available+' y revisar':'Retirar producto y revisar')+'</button><p class="tiny">No se ha confirmado ningún pedido. Puedes cambiar de bodega o modificar cantidades.</p>',true);return}let c=client(),status=discount>5?'Pendiente de aprobación':c.type==='B2B'&&totals().total>creditAvailable(c)?'Pendiente de crédito':'Confirmado · demo';let o=storeOrder(status,{address,note,delivery});cart=[];discount=0;save();render();openModal('<div style="text-align:center"><div class="success">✓</div><div class="eyebrow">'+(status==='Confirmado · demo'?'PEDIDO RECIBIDO':'SOLICITUD RECIBIDA')+'</div><h2>'+o.id+'</h2><p>'+escapeHTML(o.client)+'<br><b>'+status+'</b></p><div class="infoList"><div><span>Total con IVA demo</span><b>'+money(o.total)+'</b></div><div><span>Disponibilidad</span><b>Validación simulada</b></div></div><p class="tiny">'+(status==='Confirmado · demo'?'En producción, Odoo devolverá la confirmación y el resultado de la reserva según la política definida.':'No se reserva stock hasta completar las aprobaciones y confirmar según la política definida.')+'</p><button class="btn full" onclick="closeModal();view(\'orders\')">Ver mis pedidos →</button><p class="tiny">Demostración local. Ningún pedido fue enviado a Odoo.</p></div>',true)}
function resolveConflict(){let l=cart.find(x=>x.id===conflict.id);if(conflict.available)l.qty=conflict.available;else cart=cart.filter(x=>x.id!==conflict.id);save();closeModal();render();if(cart.length)checkout();else toast('Producto retirado. Agrega otro producto para continuar.')}
function ordersHTML(){return '<div class="heading"><div><div class="eyebrow">TRAZABILIDAD COMERCIAL</div><h1>Cada pedido, bajo control.</h1><p>Borradores y pedidos de demostración guardados en este dispositivo.</p></div><button class="btn" onclick="view(\'catalog\')">+ Nuevo pedido</button></div><div class="panel tableWrap"><table><thead><tr><th>PEDIDO</th><th>CLIENTE / FECHA</th><th>ESTADO</th><th>TOTAL</th><th>ACCIÓN</th></tr></thead><tbody>'+orders.map((o,i)=>'<tr><td><b>'+o.id+'</b><br><small>'+o.lines.length+' referencias</small></td><td>'+escapeHTML(o.client)+'<br><small>'+o.date+'</small></td><td><span class="pill '+(o.status.includes('Pendiente')?'amber':'')+'">'+o.status+'</span></td><td><b>'+money(o.total)+'</b></td><td><button class="btn light small" onclick="orderDetail('+i+')">Ver detalle</button></td></tr>').join('')+'</tbody></table>'+(orders.length?'':'<div class="empty">Todavía no hay pedidos. Crea el primero desde el catálogo.</div>')+'</div>'+footer()}
function orderDetail(i){let o=orders[i];openModal('<div class="eyebrow">COMPROBANTE DE DEMOSTRACIÓN · NO FISCAL</div><h2>'+o.id+'</h2><p>'+escapeHTML(o.client)+' · '+o.date+'</p><span class="pill">'+o.status+'</span><div class="tableWrap"><table style="margin-top:20px"><thead><tr><th>PRODUCTO</th><th>CANTIDAD</th></tr></thead><tbody>'+o.lines.map(l=>'<tr><td>'+pby(l.id).name+'</td><td>'+l.qty+' '+(pby(l.id).coverage?'cajas':pby(l.id).unit)+'</td></tr>').join('')+'</tbody></table></div><p><b>Total registrado: '+money(o.total)+'</b></p><p class="tiny">'+escapeHTML(o.address||'Dirección pendiente')+'<br>'+escapeHTML(o.note||'Sin observaciones')+'</p><div style="display:flex;gap:10px;flex-wrap:wrap" class="noPrint"><button class="btn" onclick="repeatOrder('+i+')">'+(o.status==='Borrador'?'Retomar y revalidar':'Repetir pedido')+'</button><button class="btn light" onclick="window.print()">Imprimir resumen</button><button class="btn light" onclick="downloadOrder('+i+')">Exportar JSON</button></div><p class="tiny">Al repetir se recalculan precios y se revalida disponibilidad. Los pedidos viven únicamente en este navegador.</p>')}
function repeatOrder(i){if(cart.length){toast('Guarda o vacía el pedido actual antes de cargar otro.');return}let o=orders[i];clientId=o.clientId;warehouse=o.warehouse;discount=o.discount;cart=JSON.parse(JSON.stringify(o.lines));save();closeModal();view('catalog');toast('Pedido cargado. Revisa precios y disponibilidad antes de enviar.')}
function downloadOrder(i){let blob=new Blob([JSON.stringify({...orders[i],disclaimer:'DEMO - Sin conexión real con Odoo'},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=orders[i].id+'.json';a.click();URL.revokeObjectURL(a.href)}
function clientsHTML(){return '<div class="heading"><div><div class="eyebrow">RELACIONES QUE CONSTRUYEN</div><h1>Conoce al cliente. Personaliza la venta.</h1><p>Cartera ilustrativa para explorar condiciones B2B y B2C.</p></div></div><div class="roadmap">'+clients.map(c=>'<div class="panel"><div class="avatar">'+c.initials+'</div><h3>'+c.name+'</h3><span class="pill">'+c.type+'</span><p>'+c.city+' · '+c.term+'</p><div class="infoList"><div><span>Tarifa preferencial</span><b>'+Math.round(c.discount*100)+'%</b></div><div><span>Cupo disponible</span><b>'+(c.type==='B2B'?money(creditAvailable(c)):'Contado')+'</b></div></div><button class="btn full" onclick="clientId='+c.id+';mode=\'Vendedor\';view(\'catalog\');toast(\'Condiciones actualizadas\')">Tomar pedido →</button><p class="tiny">Cliente y condiciones completamente ficticios.</p></div>').join('')+'</div>'+footer()}
function visionHTML(){return '<div class="heading"><div><div class="eyebrow">UNA EXPERIENCIA · UN SOLO ORIGEN DE DATOS</div><h1>La venta se mueve. Odoo la conecta.</h1><p>Propuesta de integración para Akabados y Grupo Fermacol.</p></div></div><div class="hero"><div><div class="eyebrow">DE LA VISITA A LA OPERACIÓN</div><h2>El pedido nace en la app.<br>La operación vive en Odoo.</h2><p>Precios, clientes, inventario y pedidos con reglas comunes para todos los canales.</p><button class="btn lime" onclick="view(\'catalog\')">Probar toma de pedidos →</button></div><div class="heroArt"><div class="floating" style="top:25px;bottom:auto;left:10%;width:80%;padding:25px"><h3>APP ↔ INTEGRACIÓN ↔ ODOO</h3><p style="color:#6c7b72">Consulta · valida · confirma</p><span class="pill">Arquitectura propuesta</span></div></div></div><div class="roadmap"><div class="panel"><span class="step">01 / EXPERIENCIA COMERCIAL</span><h3>Vender desde cualquier lugar</h3><p>Catálogo visual, clientes con tarifas propias, cálculo de cajas y pedidos en celular o tablet.</p></div><div class="panel"><span class="step">02 / INTEGRACIÓN CON ODOO</span><h3>Validar antes de comprometer</h3><p>El servidor consulta precio y disponibilidad; aplica aprobaciones y evita pedidos duplicados. La reserva depende de la confirmación en Odoo.</p></div><div class="panel"><span class="step">03 / PILOTO CONTROLADO</span><h3>Medir para escalar</h3><p>Iniciar con una bodega y vendedores seleccionados. Medir tiempo por pedido, errores de digitación y conflictos de disponibilidad.</p></div></div><div class="panel" style="margin-top:20px"><h3>Qué ya puedes probar en esta demo</h3><p>Catálogo y búsqueda · cambio B2B/B2C · tarifas por cliente · cálculo m²/cajas · stock por bodega · borradores · aprobaciones · conflicto de stock · pedidos y exportación.</p><h3 style="margin-top:20px">Para ponerlo en producción</h3><p>Definir versión y alojamiento Odoo, empresas y bodegas; depurar catálogo y conversiones; acordar crédito, impuestos, reservas y descuentos; implementar integración, permisos y pruebas con ventas.</p><p class="tiny">No hay conexión real con Odoo, cobro, facturación, autenticación o reserva de inventario. Sin promesas de ahorro ni plazos contractuales. Referencias de negocio: <a href="https://akabados.com.ec/" target="_blank" rel="noopener">Akabados</a> y <a href="https://grupofermacol.com/" target="_blank" rel="noopener">Grupo Fermacol</a>.</p></div>'+footer()}

function saveDelivery(){let a=document.getElementById('appAddress').value.trim();if(!a){toast('Ingresa la dirección o referencia de retiro.');return}deliveryData={address:a,method:document.getElementById('appDelivery').value,note:document.getElementById('appNote').value.trim()};go('review')}
function reviewApp(){let t=totals(),c=client();return '<div class="appIntro"><h1>Confirma cada detalle.</h1><p>Última revisión antes de enviar el pedido.</p></div><div class="panel"><div class="eyebrow">CLIENTE Y ENTREGA</div><h3 style="margin:12px 0">'+c.name+'</h3><p>'+escapeHTML(deliveryData.method)+'<br>'+escapeHTML(deliveryData.address||c.address)+'</p><small>'+escapeHTML(deliveryData.note||'Sin instrucciones adicionales')+'</small><button class="appText" onclick="go(\'delivery\')">Editar entrega</button></div><div class="panel" style="margin-top:15px"><h3>Resumen del pedido</h3>'+cart.map(l=>'<div class="appReviewLine"><div><b>'+pby(l.id).name+'</b><small>'+l.qty+' '+(pby(l.id).coverage?'cajas · '+(l.qty*pby(l.id).coverage).toFixed(2)+' m²':pby(l.id).unit)+'</small></div><b>'+money(lineTotal(l))+'</b></div>').join('')+'<div class="totalRow"><span>Subtotal</span><b>'+money(t.sub)+'</b></div><div class="totalRow"><span>Descuento adicional '+discount+'%</span><b>−'+money(t.disc)+'</b></div><div class="totalRow"><span>IVA demo 15%</span><b>'+money(t.vat)+'</b></div><div class="totalRow big"><span>Total</span><b>'+money(t.total)+'</b></div><p class="tiny">'+(c.type==='B2B'?'Cupo disponible simulado: '+money(creditAvailable(c)):'Pago de contado · sin cobro real')+'</p></div><div class="appSimulation"><label><input type="checkbox" id="appConflict" style="width:auto"> Probar cambio de stock antes de confirmar</label><small>Escenario opcional de demostración</small></div><p class="tiny">Se simulará la validación con Odoo. Ningún pedido se envía a un sistema real.</p>'+appAction(online?'Validar y enviar pedido →':'Guardar borrador sin conexión','sendAppOrder()')}
function sendAppOrder(){if(!cart.length)return;let c=client(),bad=cart.find(l=>l.qty>pby(l.id).stock[warehouse]);if(online&&(document.getElementById('appConflict').checked||bad)){let l=bad||cart[0],available=bad?pby(l.id).stock[warehouse]:Math.max(0,l.qty-2);conflict={id:l.id,available};openModal('<div class="eyebrow">DISPONIBILIDAD ACTUALIZADA</div><h2>El stock cambió.</h2><p>'+pby(l.id).name+' tiene '+available+' disponibles frente a '+l.qty+' solicitados.</p><button class="btn full" onclick="resolveAppConflict()">'+(available?'Ajustar cantidad y revisar':'Retirar producto y revisar')+'</button><p class="tiny">No se ha confirmado ningún pedido.</p>',true);return}let status=!online?'Borrador':discount>5?'Pendiente de aprobación':c.type==='B2B'&&totals().total>creditAvailable(c)?'Pendiente de crédito':'Confirmado · demo';lastOrder=storeOrder(status,{address:deliveryData.address,note:deliveryData.note,delivery:deliveryData.method});cart=[];discount=0;save();go('success')}
function resolveAppConflict(){let l=cart.find(x=>x.id===conflict.id);if(conflict.available)l.qty=conflict.available;else cart=cart.filter(x=>x.id!==conflict.id);save();closeModal();go(cart.length?'review':'bag')}

function visionApp(){return '<div class="appIntro"><h1>Una app. Una operación conectada.</h1><p>El vendedor toma el pedido. Odoo gobierna el negocio.</p></div>'+[['Catálogo y clientes','Productos, imágenes, tarifas y condiciones comerciales desde Odoo.'],['Disponibilidad','Consulta por bodega y revalidación al enviar.'],['Control comercial','Reglas de crédito, descuentos y aprobaciones.'],['Pedido y seguimiento','Confirmación, reserva y estado según configuración Odoo.']].map(([t,d],i)=>'<div class="panel" style="margin-bottom:14px"><div class="eyebrow">0'+(i+1)+' / INTEGRACIÓN PROPUESTA</div><h3 style="margin-top:12px">'+t+'</h3><p>'+d+'</p></div>').join('')+'<p class="tiny">Esta demo no tiene conexión real, autenticación, pagos ni reserva de inventario.</p>'}

ento '+discount+'%</span><b>−'+money(t.disc)+'</b></div>':'')+'<div class="totalRow"><span>IVA 15% · demo</span><b>'+money(t.vat)+'</b></div><div class="totalRow big"><span>Total</span><b>'+money(t.total)+'</b></div>'+(client().type==='B2B'?'<small>Cupo disponible: '+money(creditAvailable(client()))+'</small>':'')+'<p class="tiny">Flete por confirmar. Pedido de demostración.</p></div><input id="appConflict" type="checkbox" hidden>'+appAction(online?'Enviar pedido · '+money(t.total)+' →':'Guardar sin conexión','fastSend()')+'<button class="appText" onclick="saveFastDraft()">Guardar como borrador</button>'};

function trackingPage(){let list=allServiceOrders().filter(o=>(trackingFilter==='Todos'||o.stage===trackingFilter)&&(o.id+' '+o.client).toLowerCase().includes(trackingQuery.toLowerCase()));return '<div class="appIntro"><h1>Pedidos y entregas</h1></div><input aria-label="Buscar pedido" placeholder="Pedido o cliente" value="'+escapeHTML(trackingQuery)+'" oninput="trackingQuery=this.value;renderTrackingList()"><div class="filters">'+['Todos','Pendiente de crédito','Pendiente de aprobación','Confirmado','En preparación','En ruta','Entregado','Borrador'].map(v=>'<button class="chip '+(trackingFilter===v?'active':'')+'" onclick="trackingFilter=\''+v+'\';render()">'+v+'</button>').join('')+'</div><div id="trackingList">'+(list.map(trackingCard).join('')||'<div class="empty">No hay pedidos con estos filtros.</div>')+'</div><p class="tiny">Seguimiento ilustrativo. Sin GPS ni actualización real del transportista.</p>'}
function renderTrackingList(){let e=document.getElementById('trackingList');if(e)e.innerHTML=allServiceOrders().filter(o=>(trackingFilter==='Todos'||o.stage===trackingFilter)&&(o.id+' '+o.client).toLowerCase().includes(trackingQuery.toLowerCase())).map(trackingCard).join('')||'<div class="empty">No hay coincidencias.</div>'}
function openTracking(id){selectedTrackingId=id;go('trackingDetail')}
function trackingDetailPage(){let o=allServiceOrders().find(o=>o.id===selectedTrackingId);if(!o)return trackingPage();let steps=['Recibido','Confirmado','En preparación','Despachado','En ruta','Entregado'],idx=steps.indexOf(o.stage),pending=idx<0;return '<div class="appIntro"><h1>'+o.id+'</h1><p>'+escapeHTML(o.client)+'</p><span class="pill '+(pending?'amber':'')+'">'+o.stage+'</span></div><div class="panel"><div class="eyebrow">ENTREGA</div><h3 style="margin-top:10px">'+escapeHTML(o.promise)+'</h3><p>'+escapeHTML(o.address||'Dirección por confirmar')+'</p><small>'+o.route+'</small></div><div class="panel" style="margin-top:15px"><h3>Tracking del pedido</h3>'+(pending?'<p>'+escapeHTML(o.stage)+'</p><p class="tiny">La preparación y entrega comienzan después de la confirmación.</p>':'<div class="timeline">'+steps.map((s,i)=>{let ev=o.events.find(e=>e[0]===s);return '<div class="'+(i<=idx?'done':'')+'"><span>'+(i<=idx?'✓':'○')+'</span><section><b>'+s+'</b><small>'+escapeHTML(ev?.[1]||(i>idx?'Pendiente':'Etapa completada · demo'))+'</small></section></div>'}).join('')+'</div>')+'</div><div class="panel" style="margin-top:15px"><h3>Productos</h3>'+o.lines.map(l=>'<div class="totalRow"><span>'+pby(l.id).name+'</span><b>'+l.qty+' '+plural(pby(l.id))+'</b></div>').join('')+'<div class="totalRow big"><span>Total</span><b>'+money(o.total)+'</b></div></div><div class="careActions"><button class="btn" onclick="manageCustomer('+o.clientId+',\''+o.id+'\')">Registrar consulta</button><button class="btn light" onclick="openCare('+o.clientId+')">Ver cliente</button></div>'+(o.isLocal?'<button class="appText" onclick="orderDetail('+orders.findIndex(x=>x.id===o.id)+')">Resumen / repetir pedido</button>':'')+'<p class="tiny">Estados y fechas de referencia son simulados. No constituyen una promesa real de entrega.</p>'}
function budgetPage(){let b=budgetData(),overdue=clients.reduce((s,c)=>s+careStats(c).overdue,0),open=allServiceOrders().filter(o=>!['Entregado','Borrador'].includes(o.stage));return '<div class="appIntro"><h1>Mi objetivo de ventas</h1><p>Octubre 2026 · '+activeAgent.name+' · '+activeCompany+'</p></div><div class="panel"><div class="sectionTitle"><h3>Presupuesto mensual</h3><span class="pill">'+b.percent+'% cumplido</span></div><div class="creditNumber">'+money(b.actual)+'<small>de '+money(b.target)+' · ventas sin IVA</small></div><div class="meter"><i style="width:'+Math.min(100,b.percent)+'%"></i></div><div class="totalRow"><span>Falta para la meta</span><b>'+money(b.gap)+'</b></div><div class="totalRow"><span>Ritmo diario sugerido</span><b>'+money(b.daily)+'</b></div><p class="tiny">8 días de venta restantes asumidos. Base histórica ficticia más pedidos confirmados de esta demo. Cotizaciones y pedidos pendientes no suman.</p></div><div class="careMetrics">'+metric('Pedidos por atender',open.length)+metric('Cartera vencida asignada',money(overdue))+'</div><div class="panel"><h3>Prioridades de hoy</h3><button class="priority" onclick="openCare(2)"><span>Revisar cupo de Constructora Horizonte</span><b>→</b></button><button class="priority" onclick="go(\'orders\')"><span>Consultar pedidos en preparación y en ruta</span><b>→</b></button><button class="priority" onclick="go(\'customerHub\')"><span>Dar seguimiento a documentos vencidos</span><b>→</b></button></div>'}

// Ceramic batches and packaging. Quantities remain canonical boxes in order lines.
let ceramicProduct=0,ceramicFormat='f0',ceramicBatch='a',ceramicPacking='box';
function tileFormats(p){let wood=p.id===5;return [{id:'f0',name:wood?'20 × 120 cm':'60 × 120 cm',coverage:p.coverage,pieces:wood?6:2,palletBoxes:48},{id:'f1',name:wood?'20 × 100 cm':'60 × 60 cm',coverage:wood?1.4:1.44,pieces:wood?7:4,palletBoxes:40}]}
function tileBatches(){return [{id:'a',matiz:'M01 · claro',calibre:'C01',lot:'L-2610-A'},{id:'b',matiz:'M02 · natural',calibre:'C02',lot:'L-2610-B'}]}
function tileStock(p,f,b,w=warehouse){let index=(f==='f1'?2:0)+(b==='b'?1:0),n=p.stock[w];return Math.floor(n/4)+(index<n%4?1:0)}
function tileKey(id,f,b){return id+'-'+f+'-'+b}
function tileRemaining(id,f,b,exclude=null){return tileStock(pby(id),f,b)-cart.filter(l=>l.ceramicKey===tileKey(id,f,b)&&l.key!==exclude).reduce((s,l)=>s+l.qty,0)}
function tileText(l){return l.ceramicKey?[l.format,'Matiz '+l.matiz,'Calibre '+l.calibre,l.lot].join(' · '):''}
function packingText(l){return l.ceramicKey?(l.packing==='pallet'?l.packQty+' pallet(s) × '+l.palletBoxes+' cajas':l.qty+' cajas')+' · '+(l.qty*l.coverage).toFixed(2)+' m²':l.qty+' '+plural(pby(l.id))}
const baseTileDetail=detail;detail=function(id){if(!pby(id).coverage)return baseTileDetail(id);ceramicProduct=id;ceramicFormat='f0';ceramicBatch='a';ceramicPacking='box';tileDialog()};
function tileDialog(){let p=pby(ceramicProduct),f=tileFormats(p).find(f=>f.id===ceramicFormat),b=tileBatches().find(b=>b.id===ceramicBatch),remaining=tileRemaining(p.id,f.id,b.id),pallets=Math.floor(Math.max(0,remaining)/f.palletBoxes);openModal('<div class="eyebrow">CERÁMICA / '+activeCompany+'</div><h2>'+p.name+'</h2><div class="tileFields"><div><label for="tileFormat">Formato</label><select id="tileFormat" onchange="ceramicFormat=this.value;tileDialog()">'+tileFormats(p).map(x=>'<option value="'+x.id+'" '+(x.id===f.id?'selected':'')+'>'+x.name+'</option>').join('')+'</select></div><div><label for="tileBatch">Matiz / calibre</label><select id="tileBatch" onchange="ceramicBatch=this.value;tileDialog()">'+tileBatches().map(x=>'<option value="'+x.id+'" '+(x.id===b.id?'selected':'')+'>'+x.matiz+' / '+x.calibre+'</option>').join('')+'</select></div></div><div class="infoList"><div><span>Lote</span><b>'+b.lot+'</b></div><div><span>Contenido por caja</span><b>'+f.pieces+' piezas · '+f.coverage+' m²</b></div><div><span>Pallet completo</span><b>'+f.palletBoxes+' cajas · '+(f.palletBoxes*f.coverage).toFixed(2)+' m²</b></div><div><span>Disponible en '+(warehouse?'Izamba':'Primera Imprenta')+'</span><b>'+Math.max(0,remaining)+' cajas / '+pallets+' pallets completos</b></div></div><label for="tilePacking">Presentación de venta</label><select id="tilePacking" onchange="ceramicPacking=this.value;updateTileCalc()"><option value="box" '+(ceramicPacking==='box'?'selected':'')+'>Caja completa</option><option value="pallet" '+(ceramicPacking==='pallet'?'selected':'')+'>Pallet completo · '+f.palletBoxes+' cajas</option></select><label for="tileQty">Cantidad de presentaciones</label><input id="tileQty" type="number" inputmode="numeric" min="1" step="1" value="1" oninput="updateTileCalc()"><div id="tileResult" class="calc" style="margin-top:12px"></div><details style="margin:15px 0"><summary>Calcular desde superficie (m²)</summary><label for="tileArea">Área requerida</label><input id="tileArea" type="number" min="0.01" value="30"><label for="tileWaste">Adicional por cortes (%)</label><input id="tileWaste" type="number" min="0" max="50" value="10"><button class="btn light full" style="margin-top:10px" onclick="tileFromArea()">Calcular presentaciones completas</button></details>'+(cart.some(l=>l.id===p.id&&l.ceramicKey&&l.ceramicKey!==tileKey(p.id,f.id,b.id))?'<label class="tileWarning"><input id="tileMix" type="checkbox" style="width:auto"> Autorizo agregar otra combinación de formato, matiz o calibre al pedido.</label>':'')+'<button id="tileAdd" class="btn full" onclick="addTileLine()">Agregar combinación</button><p class="tiny">Formatos, lotes, matices, calibres, packing y stock ilustrativos. El contenido real se definirá por SKU en Odoo. Nunca se mezclan combinaciones en una misma línea.</p>',true);updateTileCalc()}
function tileSelected(){let p=pby(ceramicProduct),f=tileFormats(p).find(f=>f.id===ceramicFormat),b=tileBatches().find(b=>b.id===ceramicBatch),pack=document.getElementById('tilePacking').value,q=Number(document.getElementById('tileQty').value),boxes=q*(pack==='pallet'?f.palletBoxes:1);return {p,f,b,pack,q,boxes}}
function updateTileCalc(){let {p,f,b,pack,q,boxes}=tileSelected(),remaining=tileRemaining(p.id,f.id,b.id),valid=Number.isInteger(q)&&q>0;document.getElementById('tileResult').innerHTML=valid?'<b>'+q+' '+(pack==='pallet'?'pallet(s)':'caja(s)')+' = '+boxes+' cajas</b><p style="margin:6px 0;font-size:12px">'+(boxes*f.coverage).toFixed(2)+' m² · '+boxes*f.pieces+' piezas</p><b>'+money(price(p)*boxes*f.coverage)+' sin IVA</b>'+(online&&boxes>remaining?'<p class="overdue" style="font-size:11px">Stock insuficiente para esta combinación.</p>':''):'Ingresa una cantidad entera mayor a cero.';document.getElementById('tileAdd').disabled=!valid||(online&&boxes>remaining)}
function tileFromArea(){let {f,pack}=tileSelected(),area=Number(document.getElementById('tileArea').value),w=Number(document.getElementById('tileWaste').value);if(!Number.isFinite(area)||area<=0||!Number.isFinite(w)||w<0||w>50){toast('Revisa superficie y adicional (0–50%).');return}let boxes=Math.ceil(area*(1+w/100)/f.coverage);document.getElementById('tileQty').value=pack==='pallet'?Math.ceil(boxes/f.palletBoxes):boxes;updateTileCalc()}
function addTileLine(){let {p,f,b,pack,q,boxes}=tileSelected();if(p.brand!==activeCompany||!Number.isInteger(q)||q<1)return;if(online&&boxes>tileRemaining(p.id,f.id,b.id)){toast('Stock insuficiente para el lote seleccionado.');return}let mix=document.getElementById('tileMix');if(mix&&!mix.checked){toast('Confirma la combinación adicional o conserva el mismo matiz y calibre.');return}let ck=tileKey(p.id,f.id,b.id),key=ck+'-'+pack,l=cart.find(l=>l.key===key);if(l){l.qty+=boxes;l.packQty+=q}else cart.push({id:p.id,key,ceramicKey:ck,formatId:f.id,batchId:b.id,format:f.name,matiz:b.matiz,calibre:b.calibre,lot:b.lot,packing:pack,packQty:q,palletBoxes:f.palletBoxes,coverage:f.coverage,pieces:f.pieces,qty:boxes});save();closeModal();render();toast('Combinación agregada al pedido')}
const baseTileSetQty=setFastQty;setFastQty=function(id,q,redraw=true){if(pby(id).coverage){detail(id);return}baseTileSetQty(id,q,redraw)};
const baseTileProducts=renderProducts;renderProducts=function(){baseTileProducts();products.filter(p=>p.coverage&&p.brand===activeCompany).forEach(p=>{let input=document.getElementById('fq-'+p.id);if(input){let group=input.closest('.fastQuantity');group.innerHTML='<button class="btn light small" onclick="detail('+p.id+')">Matiz y packing +</button><small>'+cart.filter(l=>l.id===p.id).reduce((s,l)=>s+l.qty,0)+' cajas en pedido</small>'}})};
function changeTileLine(key,d){let l=cart.find(l=>l.key===key);if(!l)return;let step=l.packing==='pallet'?l.palletBoxes:1,q=l.qty+d*step;if(q<=0){cart=cart.filter(x=>x.key!==key)}else{if(online&&q>tileRemaining(l.id,l.formatId,l.batchId,l.key)){toast('Stock insuficiente para esta combinación.');return}l.qty=q;l.packQty=q/step}save();render()}
function deleteTileLine(key){cart=cart.filter(l=>l.key!==key);save();render()}
const baseTileBag=bagApp;bagApp=function(){let html=baseTileBag(),n=0;return html.replace(/<div class="fastBagLine">[\s\S]*?<\/div><button class="remove"[\s\S]*?<\/button><\/div>/g,old=>{let l=cart[n++];if(!l?.ceramicKey)return old;return '<div class="fastBagLine"><div><b>'+pby(l.id).name+'</b><small>'+tileText(l)+'</small><small>'+packingText(l)+'</small></div><b>'+money(lineTotal(l))+'</b><div class="qty"><button aria-label="Restar '+l.key+'" onclick="changeTileLine(\''+l.key+'\',-1)">−</button><span>'+l.packQty+'</span><button aria-label="Sumar '+l.key+'" onclick="changeTileLine(\''+l.key+'\',1)">+</button></div><button class="remove" onclick="deleteTileLine(\''+l.key+'\')">Eliminar</button></div>'})};
const baseTileSend=sendAppOrder;sendAppOrder=function(){if(online){let bad=cart.find(l=>l.ceramicKey&&cart.filter(x=>x.ceramicKey===l.ceramicKey).reduce((s,x)=>s+x.qty,0)>tileStock(pby(l.id),l.formatId,l.batchId));if(bad){toast('Revisa stock del lote '+bad.lot+' en esta bodega.');return}}baseTileSend()};
const baseTileOrderDetail=orderDetail;orderDetail=function(i){baseTileOrderDetail(i);let o=orders[i],table=document.querySelector('.modal tbody');if(o&&table)table.innerHTML=o.lines.map(l=>'<tr><td>'+pby(l.id).name+(l.ceramicKey?'<br><small>'+tileText(l)+'</small>':'')+'</td><td>'+packingText(l)+'</td></tr>').join('')};
const baseTileTracking=trackingDetailPage;trackingDetailPage=function(){let html=baseTileTracking(),o=allServiceOrders().find(x=>x.id===selectedTrackingId);if(!o)return html;for(let l of o.lines)if(l.ceramicKey)html=html.replace('<span>'+pby(l.id).name+'</span><b>'+l.qty+' '+plural(pby(l.id))+'</b>','<span>'+pby(l.id).name+'<small style="display:block">'+tileText(l)+'</small></span><b>'+packingText(l)+'</b>');return html};

const ceramicSendGuard=sendAppOrder;sendAppOrder=function(){if(cart.some(l=>pby(l.id).coverage&&!l.ceramicKey)){toast('Selecciona matiz, calibre y packing para las cerámicas del borrador anterior.');return}ceramicSendGuard()};

function clientLogo(company,cls=''){return '<img class="clientLogo '+cls+'" src="'+companyLogos[company]+'" alt="Logo '+company+'">'}

const beforeLogoCompany=companyApp;companyApp=function(){return beforeLogoCompany().replace('<span class="companySymbol">a.</span>','<div class="companyLogo">'+clientLogo('Akabados')+'</div>').replace('<span class="companySymbol">F</span>','<div class="companyLogo">'+clientLogo('Fermacol')+'</div>')};
const beforeLogoLogin=loginApp;loginApp=function(){return beforeLogoLogin().replace(/<div class="loginBrand">[\s\S]*?<\/div>/,'<div class="loginBrand officialLogos"><div>'+clientLogo('Akabados')+'<span class="logoDivider"></span>'+clientLogo('Fermacol')+'</div><small>ACCESO COMERCIAL</small></div>')};

activeAgent=null;activeCompany=null;appScreen='login';cart=[];orders=[];render();


// Keep the app usable when the mobile browser chrome or on-screen keyboard changes height.
function fitMobileViewport(){let mobile=matchMedia('(max-width:600px), (max-width:950px) and (max-height:600px)').matches;document.documentElement.style.setProperty('--mobile-app-height',mobile?(window.visualViewport?.height||window.innerHeight)+'px':'100dvh');if(mobile&&document.activeElement?.matches('input,textarea,select'))requestAnimationFrame(()=>document.activeElement?.scrollIntoView({block:'nearest',inline:'nearest'}))}
window.addEventListener('resize',fitMobileViewport);window.visualViewport?.addEventListener('resize',fitMobileViewport);fitMobileViewport();

</script></body></html>
