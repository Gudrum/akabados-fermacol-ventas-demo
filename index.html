function catalogHTML(){return '<div class="heading"><div><div class="eyebrow">TU PRÓXIMA VENTA EMPIEZA AQUÍ</div><h1>Todo para construir. Listo para vender.</h1><p>Un catálogo conectado a cada oportunidad.</p></div><button class="btn light" onclick="startGuide()">▷ Recorrido guiado</button></div>'+guideHTML()+'<section class="hero"><div><div class="eyebrow">AKABADOS × FERMACOL</div><h2>Del proyecto de tu cliente<br>al pedido perfecto.</h2><p>Encuentra el acabado ideal, calcula cantidades y toma pedidos desde donde estés.</p><button class="btn lime small" onclick="document.getElementById(\'search\').focus()">Explorar colección ↗</button></div><div class="heroArt"><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="floating"><span class="dot"></span>Catálogo y stock en un solo lugar</div></div></section><div class="stats"><div class="stat"><small>Pedido actual</small><b>'+money(totals().total)+'</b><small>Incluye IVA demo 15%</small></div><div class="stat"><small>Cliente seleccionado</small><b style="font-size:17px">'+client().name+'</b><small>'+client().type+' · '+client().term+'</small></div><div class="stat"><small>Condición comercial</small><b>'+Math.round(client().discount*100)+'% <span style="font-size:11px;font-weight:400">tarifa cliente</span></b><small class="up">Aplicada automáticamente · demo</small></div><div class="stat"><small>Disponibilidad</small><b style="font-size:17px">'+(online?'Consulta activa':'Sin conexión')+'</b><small>'+ (warehouse===0?'Primera Imprenta':'Izamba')+' · stock simulado</small></div></div><div class="workspace"><section><div class="sectionTitle"><h2>Catálogo de productos <small style="font-size:11px" id="resultCount"></small></h2><button class="btn light small" onclick="settings()">⚙ Configurar venta</button></div><div class="searchRow"><input id="search" aria-label="Buscar productos" placeholder="Buscar producto, código o acabado…" value="'+escapeHTML(query)+'" oninput="query=this.value;renderProdu function cartHTML(){let t=totals();return '<aside class="panel cart" id="cart"><div class="cartHead"><h2>Tu pedido</h2><span class="count">'+cart.length+' ref.</span></div><div class="clientBox"><div style="display:flex;justify-content:space-between"><strong>'+client().name+'</strong><button class="remove" onclick="settings()">Cambiar</button></div><small>'+client().type+' · '+client().term+' · '+mode+'</small></div><div class="cartLines">'+(cart.length?cart.map(l=>{let p=pby(l.id);return '<div class="cartLine"><h4>'+p.name+'</h4><small style="font-size:10px">'+(p.coverage?l.qty+' cajas · '+(l.qty*p.coverage).toFixed(2)+' m²':l.qty+' '+p.unit)+' · '+money(price(p))+'/'+p.unit+'</small><div class="qtyRow"><div class="qty"><button aria-label="Restar '+p.name+'" onclick="quantity('+p.id+',-1)">−</button><span>'+l.qty+'</span><button aria-label="Sumar '+p.name+'" onclick="quantity('+p.id+',1)">+</button></div><b style="font-size:12px">'+money(lineTotal(l))+'</b><button class="remove" aria-label="Eliminar '+p.name+'" onclick="removeLine('+p.id+')">×</button></div></div>'}).join(''):'<div class="empty"><span class="emptyIcon">▧</span>El próximo proyecto empieza<br>con el primer producto.</div>')+'</div><div class="totals"><div class="totalRow"><span>Subtotal sin IVA</span><span>'+money(t.sub)+'</span></div>'+(discount?'<div class="totalRow"><span>Descuento adicional '+discount+'%</span><span>−'+money(t.disc)+'</span></div>':'')+'<div class="totalRow"><span>IVA demo (15%)</span><span>'+money(t.vat)+'</span></div><div class="totalRow big"><span>Total</span><span>'+money(t.total)+'</span></div></div><button class="btn full" '+(!cart.length?'disabled':'')+' onclick="checkout()">Revisar pedido →</button><div style="display:flex;justify-content:space-between;margin:12px 0"><button class="remove" onclick="saveDraft()">Guardar borrador</button><button class="remove" onclick="cart=[];save();render()">Vaciar pedido</button></div><p class="tiny">La disponibilidad se revalida al enviar. El flete se cotiza por separado. No se realiza ningún cobro.</p></aside>'}
function quantity(id,d){let l=cart.find(x=>x.id===id);if(!l)return;if(l.qty+d>pby(id).stock[warehouse]&&online){toast('Cantidad superior al stock simulado de esta bodega.');return}l.qty+=d;if(l.qty<=0)cart=cart.filter(x=>x.id!==id);save();render()}function removeLine(id){cart=cart.filter(x=>x.id!==id);save();render()}
function openModal(html,narrow=false){document.getElementById('modalRoot').innerHTML='<div class="overlay" onclick="if(event.target===this)closeModal()"><section role="dialog" aria-modal="true" aria-label="Detalle de demo" class="modal '+(narrow?'narrow':'')+'"><button class="close noPrint" aria-label="Cerrar" onclick="closeModal()">×</button>'+html+'</section></div>';document.querySelector('.modal .close').focus()}function closeModal(){document.getElementById('modalRoot').innerHTML=''}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function detail(id){let p=pby(id);openModal('<div class="eyebrow">'+p.brand+' / '+p.sku+'</div><h2>'+p.name+'</h2><p style="color:var(--muted);margin-top:0">'+p.spec+'</p><div class="two"><div class="detailVisual">'+visual(p)+'<div class="infoList"><div><span>Primera Imprenta</span><b>'+p.stock[0]+' '+(p.coverage?'cajas':p.unit)+'</b></div><div><span>Izamba</span><b>'+p.stock[1]+' '+(p.coverage?'cajas':p.unit)+'</b></div></div><p class="tiny">Existencias simuladas. Bodega activa: '+(warehouse===0?'Primera Imprenta':'Izamba')+'. '+(p.coverage?'Tono y calibre: confirmar en implementación.':'')+'</p></div><div><div class="price" style="font-size:28px">'+money(price(p))+' <span class="unit">/ '+p.unit+' sin IVA</span></div><p class="tiny">Tarifa '+client().type+' · '+Math.round(client().discount*100)+'% aplicado</p>'+(p.coverage?'<div class="calc"><b>Calcula tu proyecto</b><label for="area">Superficie requerida (m²)</label><input id="area" type="number" min="0.01" max="100000" value="30" oninput="calculate('+id+')"><label for="waste">Desperdicio adicional</label><select id="waste" onchange="calculate('+id+')"><option value="0">Sin adicional</option><option value="5">5%</option><option value="10" selected>10% recomendado para demo</option><option value="15">15%</option></select><div class="calcResult" id="calcResult"></div></div>':'')+'<label for="detailQty">Cantidad de '+(p.coverage?'cajas completas':({unidad:'unidades',saco:'sacos',bolsa:'bolsas',galón:'galones',kit:'kits'}[p.unit]||p.unit))+'</label><input id="detailQty" type="number" min="1" step="1" value="1" oninput="updateDetailTotal('+id+')"><p id="detailTotal"></p><button class="btn full" onclick="addFromDetail('+id+')">Agregar al pedido +</button><p class="tiny">Los precios y conversiones de este demo deben validarse con el catálogo maestro.</p></div></div>');if(p.coverage)calculate(id);else updateDetailTotal(id)}
function calculate(id){let p=pby(id),a=Number(document.getElementById('area').value),w=Number(document.getElementById('waste').value),q=Math.ceil(a*(1+w/100)/p.coverage);document.getElementById('calcResult').innerHTML=a>0&&Number.isFinite(q)?'<b>'+q+' cajas</b> · '+(q*p.coverage).toFixed(2)+' m² suministrados<br><small>'+p.coverage+' m²/caja · redondeo a caja completa</small>':'Ingresa una superficie válida.';document.getElementById('detailQty').value=a>0?q:1;updateDetailTotal(id)}
function updateDetailTotal(id){let p=pby(id),q=Number(document.getElementById('detailQty').value);document.getElementById('detailTotal').innerHTML='Subtotal sin IVA: <b>'+money(price(p)*(p.coverage||1)*q)+'</b>'}
function addFromDetail(id){let q=Number(document.getElementById('detailQty').value),p=pby(id),existing=cart.find(l=>l.id===id);if(!Number.isInteger(q)||q<1){toast('Ingresa una cantidad entera mayor a cero.');return}if(online&&q+(existing?.qty||0)>p.stock[warehouse]){toast('Stock insuficiente. Reduce la cantidad o cambia de bodega.');return}if(existing)existing.qty+=q;else cart.push({id,qty:q});save();closeModal();render();toast(p.name+' agregado al pedido')}
function settings(){openModal('<div class="eyebrow">CONDICIONES DE VENTA</div><h2>Cada cliente, su experiencia.</h2><label for="mode">Experiencia</label><select id="mode"><option '+(mode==='Vendedor'?'selected':'')+'>Vendedor</option><option '+(mode==='Cliente B2B'?'selected':'')+'>Cliente B2B</option><option '+(mode==='Cliente B2C'?'selected':'')+'>Cliente B2C</option></select><label for="clientSelect">Cliente de demostración</label><select id="clientSelect">'+clients.map(c=>'<option value="'+c.id+'" '+(clientId===c.id?'selected':'')+'>'+c.name+' · '+c.type+'</option>').join('')+'</select><label for="warehouse">Bodega de despacho</label><select id="warehouse"><option value="0" '+(!warehouse?'selected':'')+'>Primera Imprenta</option><option value="1" '+(warehouse?'selected':'')+'>Izamba</option></select><label for="discount">Descuento adicional solicitado (%)</label><input id="discount" type="number" min="0" max="30" value="'+discount+'"><p class="tiny">Más de 5% genera aprobación comercial. Regla ilustrativa.</p><label for="network">Conectividad simulada</label><select id="network"><option value="on" '+(online?'selected':'')+'>En línea · simulación</option><option value="off" '+(!online?'selected':'')+'>Sin conexión · guardar borradores</option></select><button class="btn full" style="margin-top:20px" onclick="applySettings()">Aplicar condiciones</button><p class="tiny">Selector de roles exclusivo de la demo. En producción cada usuario tendría permisos y acceso propios.</p>',true)}
function applySettings(){let d=Number(document.getElementById('discount').value);if(!Number.isFinite(d)||d<0||d>30){toast('El descuento debe estar entre 0 y 30%.');return}mode=document.getElementById('mode').value;clientId=Number(document.getElementById('clientSelect').value);if(mode==='Cliente B2C')clientId=3;if(mode==='Cliente B2B'&&clientId===3)clientId=1;warehouse=Number(document.getElementById('warehouse').value);discount=d;online=document.getElementById('network').value==='on';closeModal();render();toast('Precios y condiciones actualizados para '+client().name)}
function saveDraft(){if(!cart.length){toast('Agrega al menos un producto.');return}storeOrder('Borrador');cart=[];save();render();toast('Borrador guardado en este dispositivo')}
function storeOrder(status,extra={}){let c=client(),t=totals();let o={id:'DEMO-'+String(Date.now()).slice(-7),date:new Date().toLocaleDateString('es-EC'),client:c.name,clientId,warehouse,discount,total:t.total,lines:JSON.parse(JSON.stringify(cart)),status,...extra};orders.unshift(o);save();return o}
function checkout(){if(!cart.length)return;let t=totals(),c=client();openModal('<div class="eyebrow">ÚLTIMO PASO / REVISIÓN</div><h2>Un pedido listo para avanzar.</h2><p>'+c.name+' · '+c.type+' · '+c.term+'</p><div class="two"><div><label for="delivery">Modalidad de entrega</label><select id="delivery"><option>Despacho a dirección del cliente</option><option>Retiro en bodega</option></select><label for="address">Dirección / referencia</label><input id="address" maxlength="200" value="'+escapeHTML(c.address)+'"><label for="note">Observaciones</label><textarea id="note" maxlength="500" placeholder="Horario, contacto o instrucciones de entrega"></textarea><label><input id="simulateConflict" type="checkbox" style="width:auto"> Simular cambio de stock al enviar</label><p class="tiny">El flete se cotiza por separado. No se procesa pago ni se envía un pedido real.</p></div><div class="panel" style="background:#f7f8f3"><h3 style="font-size:15px">Resumen comercial</h3>'+cart.map(l=>'<div class="totalRow"><span>'+pby(l.id).name+' × '+l.qty+'</span><b>'+money(lineTotal(l))+'</b></div>').join('')+'<hr style="border:0;border-top:1px solid var(--line)"><div class="totalRow"><span>Descuento adicional</span><span>−'+money(t.disc)+'</span></div><div class="totalRow"><span>IVA demo 15%</span><span>'+money(t.vat)+'</span></div><div class="totalRow big"><span>Total</span><span>'+money(t.total)+'</span></div><p class="tiny">'+(c.type==='B2B'?'Cupo disponible simulado: '+money(c.credit-c.balance):'Condición: contado. Sin cobro real.')+'</p><button class="btn full" id="submitOrder" onclick="submitOrder()">'+(online?'Validar y enviar pedido':'Guardar borrador sin conexión')+' →</button></div></div>')}
function submitOrder(){let address=document.getElementById('address').value.trim(),note=document.getElementById('note').value.trim(),delivery=document.getElementById('delivery').value;if(!address){toast('Completa la dirección o referencia de retiro.');return}if(!online){storeOrder('Borrador',{address,note,delivery});cart=[];save();closeModal();view('orders');toast('Guardado localmente. Revalidar al recuperar conexión.');return}let insufficient=cart.find(l=>l.qty>pby(l.id).stock[warehouse]);if(document.getElementById('simulateConflict').checked||insufficient){let l=insufficient||cart[0],p=pby(l.id),available=insufficient?p.stock[warehouse]:Math.max(0,l.qty-2);conflict={id:l.id,available,address,note,delivery};openModal('<div class="eyebrow">REVALIDACIÓN DE DISPONIBILIDAD</div><h2>El stock ha cambiado.</h2><p>Otra venta consumió parte de <b>'+p.name+'</b>. Simulamos el caso antes de confirmar.</p><div class="infoList"><div><span>Solicitado</span><b>'+l.qty+'</b></div><div><span>Disponible ahora</span><b>'+available+'</b></div></div><button class="btn full" onclick="resolveConflict()">'+(available?'Ajustar a '+available+' y revisar':'Retirar producto y revisar')+'</button><p class="tiny">No se ha confirmado ningún pedido. Puedes cambiar de bodega o modificar cantidades.</p>',true);return}let c=client(),status=discount>5?'Pendiente de aprobación':c.type==='B2B'&&totals().total>c.credit-c.balance?'Pendiente de crédito':'Confirmado · demo';let o=storeOrder(status,{address,note,delivery});cart=[];discount=0;save();render();openModal('<div style="text-align:center"><div class="success">✓</div><div class="eyebrow">'+(status==='Confirmado · demo'?'PEDIDO RECIBIDO':'SOLICITUD RECIBIDA')+'</div><h2>'+o.id+'</h2><p>'+escapeHTML(o.client)+'<br><b>'+status+'</b></p><div class="infoList"><div><span>Total con IVA demo</span><b>'+money(o.total)+'</b></div><div><span>Disponibilidad</span><b>Validación simulada</b></div></div><p class="tiny">'+(status==='Confirmado · demo'?'En producción, Odoo devolverá la confirmación y el resultado de la reserva según la política definida.':'No se reserva stock hasta completar las aprobaciones y confirmar según la política definida.')+'</p><button class="btn full" onclick="closeModal();view(\'orders\')">Ver mis pedidos →</button><p class="tiny">Demostración local. Ningún pedido fue enviado a Odoo.</p></div>',true)}
function resolveConflict(){let l=cart.find(x=>x.id===conflict.id);if(conflict.available)l.qty=conflict.available;else cart=cart.filter(x=>x.id!==conflict.id);save();closeModal();render();if(cart.length)checkout();else toast('Producto retirado. Agrega otro producto para continuar.')}
function ordersHTML(){return '<div class="heading"><div><div class="eyebrow">TRAZABILIDAD COMERCIAL</div><h1>Cada pedido, bajo control.</h1><p>Borradores y pedidos de demostración guardados en este dispositivo.</p></div><button class="btn" onclick="view(\'catalog\')">+ Nuevo pedido</button></div><div class="panel tableWrap"><table><thead><tr><th>PEDIDO</th><th>CLIENTE / FECHA</th><th>ESTADO</th><th>TOTAL</th><th>ACCIÓN</th></tr></thead><tbody>'+orders.map((o,i)=>'<tr><td><b>'+o.id+'</b><br><small>'+o.lines.length+' referencias</small></td><td>'+escapeHTML(o.client)+'<br><small>'+o.date+'</small></td><td><span class="pill '+(o.status.includes('Pendiente')?'amber':'')+'">'+o.status+'</span></td><td><b>'+money(o.total)+'</b></td><td><button class="btn light small" onclick="orderDetail('+i+')">Ver detalle</button></td></tr>').join('')+'</tbody></table>'+(orders.length?'':'<div class="empty">Todavía no hay pedidos. Crea el primero desde el catálogo.</div>')+'</div>'+footer()}
function orderDetail(i){let o=orders[i];openModal('<div class="eyebrow">COMPROBANTE DE DEMOSTRACIÓN · NO FISCAL</div><h2>'+o.id+'</h2><p>'+escapeHTML(o.client)+' · '+o.date+'</p><span class="pill">'+o.status+'</span><div class="tableWrap"><table style="margin-top:20px"><thead><tr><th>PRODUCTO</th><th>CANTIDAD</th></tr></thead><tbody>'+o.lines.map(l=>'<tr><td>'+pby(l.id).name+'</td><td>'+l.qty+' '+(pby(l.id).coverage?'cajas':pby(l.id).unit)+'</td></tr>').join('')+'</tbody></table></div><p><b>Total registrado: '+money(o.total)+'</b></p><p class="tiny">'+escapeHTML(o.address||'Dirección pendiente')+'<br>'+escapeHTML(o.note||'Sin observaciones')+'</p><div style="display:flex;gap:10px;flex-wrap:wrap" class="noPrint"><button class="btn" onclick="repeatOrder('+i+')">'+(o.status==='Borrador'?'Retomar y revalidar':'Repetir pedido')+'</button><button class="btn light" onclick="window.print()">Imprimir resumen</button><button class="btn light" onclick="downloadOrder('+i+')">Exportar JSON</button></div><p class="tiny">Al repetir se recalculan precios y se revalida disponibilidad. Los pedidos viven únicamente en este navegador.</p>')}
function repeatOrder(i){if(cart.length){toast('Guarda o vacía el pedido actual antes de cargar otro.');return}let o=orders[i];clientId=o.clientId;warehouse=o.warehouse;discount=o.discount;cart=JSON.parse(JSON.stringify(o.lines));save();closeModal();view('catalog');toast('Pedido cargado. Revisa precios y disponibilidad antes de enviar.')}
function downloadOrder(i){let blob=new Blob([JSON.stringify({...orders[i],disclaimer:'DEMO - Sin conexión real con Odoo'},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=orders[i].id+'.json';a.click();URL.revokeObjectURL(a.href)}

function visionHTML(){return '<div class="heading"><div><div class="eyebrow">UNA EXPERIENCIA · UN SOLO ORIGEN DE DATOS</div><h1>La venta se mueve. Odoo la conecta.</h1><p>Propuesta de integración para Akabados y Grupo Fermacol.</p></div></div><div class="hero"><div><div class="eyebrow">DE LA VISITA A LA OPERACIÓN</div><h2>El pedido nace en la app.<br>La operación vive en Odoo.</h2><p>Precios, clientes, inventario y pedidos con reglas comunes para todos los canales.</p><button class="btn lime" onclick="view(\'catalog\')">Probar toma de pedidos →</button></div><div class="heroArt"><div class="floating" style="top:25px;bottom:auto;left:10%;width:80%;padding:25px"><h3>APP ↔ INTEGRACIÓN ↔ ODOO</h3><p style="color:#6c7b72">Consulta · valida · confirma</p><span class="pill">Arquitectura propuesta</span></div></div></div><div class="roadmap"><div class="panel"><span class="step">01 / EXPERIENCIA COMERCIAL</span><h3>Vender desde cualquier lugar</h3><p>Catálogo visual, clientes con tarifas propias, cálculo de cajas y pedidos en celular o tablet.</p></div><div class="panel"><span class="step">02 / INTEGRACIÓN CON ODOO</span><h3>Validar antes de comprometer</h3><p>El servidor consulta precio y disponibilidad; aplica aprobaciones y evita pedidos duplicados. La reserva depende de la confirmación en Odoo.</p></div><div class="panel"><span class="step">03 / PILOTO CONTROLADO</span><h3>Medir para escalar</h3><p>Iniciar con una bodega y vendedores seleccionados. Medir tiempo por pedido, errores de digitación y conflictos de disponibilidad.</p></div></div><div class="panel" style="margin-top:20px"><h3>Qué ya puedes probar en esta demo</h3><p>Catálogo y búsqueda · cambio B2B/B2C · tarifas por cliente · cálculo m²/cajas · stock por bodega · borradores · aprobaciones · conflicto de stock · pedidos y exportación.</p><h3 style="margin-top:20px">Para ponerlo en producción</h3><p>Definir versión y alojamiento Odoo, empresas y bodegas; depurar catálogo y conversiones; acordar crédito, impuestos, reservas y descuentos; implementar integración, permisos y pruebas con ventas.</p><p class="tiny">No hay conexión real con Odoo, cobro, facturación, autenticación o reserva de inventario. Sin promesas de ahorro ni plazos contractuales. Referencias de negocio: <a href="https://akabados.com.ec/" target="_blank" rel="noopener">Akabados</a> y <a href="https://grupofermacol.com/" target="_blank" rel="noopener">Grupo Fermacol</a>.</p></div>'+footer()}

function homeApp(){return '<div class="greeting"><div class="eyebrow">HOLA, EQUIPO COMERCIAL</div><h1>Una nueva visita.<br>Una gran oportunidad.</h1><p>Todo lo que necesitas para tomar el próximo pedido.</p></div><section class="appHero"><div class="eyebrow">VENTA EN MOVIMIENTO</div><h2>Del proyecto<br>al pedido.</h2><p>Asesora, calcula y vende<br>desde donde estés.</p><button class="btn lime" onclick="go(\'clients\')">+ Comenzar pedido</button><div class="appHeroTile"></div></section><div class="appQuick"><button onclick="go(\'orders\')"><b>'+orders.length+'</b><span>Pedidos guardados →</span></button><button onclick="go(\'bag\')"><b>'+cart.length+'</b><span>Productos en carrito →</span></button></div><div class="sectionTitle"><h3>Tu ruta de venta</h3><span class="pill">5 pasos</span></div><div class="journeyList">'+[['01','Conoce a tu cliente','Su tarifa, dirección y condición comercial.'],['02','Construye el pedido','Encuentra productos y calcula cantidades.'],['03','Confirma con confianza','Revisa entrega, precios y disponibilidad.']].map(([n,t,d])=>'<div><span>'+n+'</span><section><b>'+t+'</b><p>'+d+'</p></section></div>').join('')+'</div><button class="appText" onclick="go(\'vision\')">Descubre cómo se conectará con Odoo ↗</button>'}
function clientApp(){return '<div class="appIntro"><h1>¿A quién visitamos hoy?</h1><p>Selecciona un cliente para aplicar sus condiciones.</p></div><input aria-label="Buscar cliente" placeholder="Buscar cliente o ciudad…" value="'+escapeHTML(appClientQuery)+'" oninput="appClientQuery=this.value;renderClientList()"><div id="clientList" class="appClients"></div><p class="tiny">Cartera ilustrativa. Todos los clientes y cupos son ficticios.</p>'}
function renderClientList(){let e=document.getElementById('clientList');if(!e)return;e.innerHTML=clients.filter(c=>(c.name+' '+c.city).toLowerCase().includes(appClientQuery.toLowerCase())).map(c=>'<button class="appClient" onclick="chooseAppClient('+c.id+')"><span class="avatar">'+c.initials+'</span><section><b>'+c.name+'</b><small>'+c.city+' · '+c.type+' · '+c.term+'</small><span class="pill">'+(c.discount?Math.round(c.discount*100)+'% tarifa preferencial':'Precio público')+'</span></section><span>→</span></button>').join('')||'<p>No se encontraron clientes.</p>'}
function chooseAppClient(id){clientId=id;mode='Vendedor';discount=0;deliveryData.address=client().address;go('catalog');toast('Tarifa de '+client().name+' aplicada')}
function catalogApp(){return '<div class="appCustomer"><div class="avatar">'+client().initials+'</div><div><b>'+client().name+'</b><small>'+client().type+' · '+client().term+'</small></div><button onclick="go(\'clients\')">Cambiar</button></div><div class="sectionTitle"><h1>Elige para su proyecto</h1><button class="appText" onclick="settings()">'+(warehouse?'Izamba':'Primera Imprenta')+' ⌄</button></div><div class="searchRow"><input id="search" aria-label="Buscar productos" placeholder="Producto, código o acabado…" value="'+escapeHTML(query)+'" oninput="query=this.value;renderProducts()"></div><div class="filters">'+['Todos','Pisos y revestimientos','Baños y grifería','Construcción','Herramientas','Pinturas'].map(c=>'<button class="chip '+(category===c?'active':'')+'" onclick="category=\''+c+'\';render()">'+c+'</button>').join('')+'</div><div class="sectionTitle"><small id="resultCount"></small><select class="appBrand" aria-label="Filtrar marca" onchange="brand=this.value;renderProducts()">'+['Todas','Akabados','Fermacol'].map(b=>'<option '+(brand===b?'selected':'')+'>'+b+'</option>').join('')+'</select></div><div class="grid" id="products"></div><p class="tiny">Ilustraciones conceptuales · precios y stock ficticios.</p>'+appAction(cart.length?'Continuar al carrito · '+money(totals().total)+' →':'Agrega productos para continuar','go(\'bag\')',!cart.length)}
function bagApp(){return '<div class="appIntro"><h1>Todo listo para revisar.</h1><p>'+client().name+' · '+cart.length+' referencias</p></div>'+cartHTML()+(cart.length?'<button class="appText" onclick="go(\'catalog\')">+ Agregar más productos</button>':'<button class="btn full" onclick="go(\'catalog\')">Explorar catálogo →</button>')}
function checkout(){if(cart.length)go('delivery')}
function deliveryApp(){return '<div class="appIntro"><h1>¿Dónde lo entregamos?</h1><p>Deja claras las instrucciones para el despacho.</p></div><div class="panel"><label for="appDelivery">Modalidad</label><select id="appDelivery"><option '+(deliveryData.method==='Despacho a dirección del cliente'?'selected':'')+'>Despacho a dirección del cliente</option><option '+(deliveryData.method==='Retiro en bodega'?'selected':'')+'>Retiro en bodega</option></select><label for="appAddress">Dirección o referencia de retiro</label><input id="appAddress" maxlength="200" value="'+escapeHTML(deliveryData.address||client().address)+'"><label for="appNote">Observaciones del pedido</label><textarea id="appNote" maxlength="500" rows="4" placeholder="Horario, contacto o indicaciones…">'+escapeHTML(deliveryData.note)+'</textarea><div class="infoList"><div><span>Bodega</span><b>'+(warehouse?'Izamba':'Primera Imprenta')+'</b></div><div><span>Condición comercial</span><b>'+client().term+'</b></div></div><p class="tiny">El flete se cotiza por separado. No se procesa ningún cobro.</p></div>'+appAction('Continuar a revisión →','saveDelivery()')}
function saveDelivery(){let a=document.getElementById('appAddress').value.trim();if(!a){toast('Ingresa la dirección o referencia de retiro.');return}deliveryData={address:a,method:document.getElementById('appDelivery').value,note:document.getElementById('appNote').value.trim()};go('review')}
function reviewApp(){let t=totals(),c=client();return '<div class="appIntro"><h1>Confirma cada detalle.</h1><p>Última revisión antes de enviar el pedido.</p></div><div class="panel"><div class="eyebrow">CLIENTE Y ENTREGA</div><h3 style="margin:12px 0">'+c.name+'</h3><p>'+escapeHTML(deliveryData.method)+'<br>'+escapeHTML(deliveryData.address||c.address)+'</p><small>'+escapeHTML(deliveryData.note||'Sin instrucciones adicionales')+'</small><button class="appText" onclick="go(\'delivery\')">Editar entrega</button></div><div class="panel" style="margin-top:15px"><h3>Resumen del pedido</h3>'+cart.map(l=>'<div class="appReviewLine"><div><b>'+pby(l.id).name+'</b><small>'+l.qty+' '+(pby(l.id).coverage?'cajas · '+(l.qty*pby(l.id).coverage).toFixed(2)+' m²':pby(l.id).unit)+'</small></div><b>'+money(lineTotal(l))+'</b></div>').join('')+'<div class="totalRow"><span>Subtotal</span><b>'+money(t.sub)+'</b></div><div class="totalRow"><span>Descuento adicional '+discount+'%</span><b>−'+money(t.disc)+'</b></div><div class="totalRow"><span>IVA demo 15%</span><b>'+money(t.vat)+'</b></div><div class="totalRow big"><span>Total</span><b>'+money(t.total)+'</b></div><p class="tiny">'+(c.type==='B2B'?'Cupo disponible simulado: '+money(c.credit-c.balance):'Pago de contado · sin cobro real')+'</p></div><div class="appSimulation"><label><input type="checkbox" id="appConflict" style="width:auto"> Probar cambio de stock antes de confirmar</label><small>Escenario opcional de demostración</small></div><p class="tiny">Se simulará la validación con Odoo. Ningún pedido se envía a un sistema real.</p>'+appAction(online?'Validar y enviar pedido →':'Guardar borrador sin conexión','sendAppOrder()')}
function sendAppOrder(){if(!cart.length)return;let c=client(),bad=cart.find(l=>l.qty>pby(l.id).stock[warehouse]);if(online&&(document.getElementById('appConflict').checked||bad)){let l=bad||cart[0],available=bad?pby(l.id).stock[warehouse]:Math.max(0,l.qty-2);conflict={id:l.id,available};openModal('<div class="eyebrow">DISPONIBILIDAD ACTUALIZADA</div><h2>El stock cambió.</h2><p>'+pby(l.id).name+' tiene '+available+' disponibles frente a '+l.qty+' solicitados.</p><button class="btn full" onclick="resolveAppConflict()">'+(available?'Ajustar cantidad y revisar':'Retirar producto y revisar')+'</button><p class="tiny">No se ha confirmado ningún pedido.</p>',true);return}let status=!online?'Borrador':discount>5?'Pendiente de aprobación':c.type==='B2B'&&totals().total>c.credit-c.balance?'Pendiente de crédito':'Confirmado · demo';lastOrder=storeOrder(status,{address:deliveryData.address,note:deliveryData.note,delivery:deliveryData.method});cart=[];discount=0;save();go('success')}
function resolveAppConflict(){let l=cart.find(x=>x.id===conflict.id);if(conflict.available)l.qty=conflict.available;else cart=cart.filter(x=>x.id!==conflict.id);save();closeModal();go(cart.length?'review':'bag')}
function successApp(){let o=lastOrder;if(!o)return homeApp();return '<div class="appSuccess"><div class="success">✓</div><div class="eyebrow">'+(o.status==='Borrador'?'GUARDADO EN ESTE DISPOSITIVO':'SOLICITUD REGISTRADA')+'</div><h1>'+ (o.status==='Confirmado · demo'?'¡Pedido listo!':'Tu pedido sigue avanzando.')+'</h1><p>'+o.id+'<br>'+escapeHTML(o.client)+'</p><span class="pill">'+o.status+'</span><div class="panel" style="margin:25px 0;text-align:left"><div class="totalRow"><span>Referencias</span><b>'+o.lines.length+'</b></div><div class="totalRow big"><span>Total</span><b>'+money(o.total)+'</b></div><p class="tiny">'+(o.status==='Confirmado · demo'?'Confirmación simulada. La reserva real dependerá de la política configurada en Odoo.':o.status==='Borrador'?'Sin envío. Revisa y revalida al recuperar conexión.':'Pendiente de autorización. Sin reserva de stock.')+'</p></div><button class="btn full" onclick="go(\'orders\')">Ver mis pedidos →</button><button class="btn light full" style="margin-top:10px" onclick="go(\'clients\')">Comenzar otro pedido</button><p class="tiny">No se han enviado datos a Odoo ni realizado cobros.</p></div>'}
function ordersApp(){return '<div class="appIntro"><h1>Tu actividad comercial.</h1><p>Retoma una oportunidad o repite una venta.</p></div><button class="btn full" onclick="go(\'clients\')">+ Nuevo pedido</button><div class="appOrderList">'+(orders.length?orders.map((o,i)=>'<button class="appOrder" onclick="orderDetail('+i+')"><div><b>'+o.id+'</b><span class="pill '+(o.status.includes('Pendiente')?'amber':'')+'">'+o.status+'</span></div><h3>'+escapeHTML(o.client)+'</h3><small>'+o.date+' · '+o.lines.length+' referencias</small><footer><b>'+money(o.total)+'</b><span>Ver detalle →</span></footer></button>').join(''):'<div class="empty">Tu primer pedido aparecerá aquí.</div>')+'</div><p class="tiny">Historial de demostración guardado en este navegador.</p>'}
function visionApp(){return '<div class="appIntro"><h1>Una app. Una operación conectada.</h1><p>El vendedor toma el pedido. Odoo gobierna el negocio.</p></div>'+[['Catálogo y clientes','Productos, imágenes, tarifas y condiciones comerciales desde Odoo.'],['Disponibilidad','Consulta por bodega y revalidación al enviar.'],['Control comercial','Reglas de crédito, descuentos y aprobaciones.'],['Pedido y seguimiento','Confirmación, reserva y estado según configuración Odoo.']].map(([t,d],i)=>'<div class="panel" style="margin-bottom:14px"><div class="eyebrow">0'+(i+1)+' / INTEGRACIÓN PROPUESTA</div><h3 style="margin-top:12px">'+t+'</h3><p>'+d+'</p></div>').join('')+'<p class="tiny">Esta demo no tiene conexión real, autenticación, pagos ni reserva de inventario.</p>'}
function render(){let app=document.getElementById('app');let pages={home:homeApp,clients:clientApp,catalog:catalogApp,bag:bagApp,delivery:deliveryApp,review:reviewApp,success:successApp,orders:ordersApp,vision:visionApp};app.innerHTML=topApp()+progress()+'<div class="appPage">'+(pages[appScreen]||homeApp)()+'</div>'+bottomApp();if(appScreen==='catalog')renderProducts();if(appScreen==='clients')renderClientList()}
function intro(){go('home')}function startGuide(){go('clients')}
// Keep existing detailed product, settings and order tools within this screen-based shell.

// Multi-agent / multi-company demo. No real credentials or server authentication.
const salesAgents=[{id:'ana',name:'Ana Torres',zone:'Ambato · Centro',companies:['Akabados','Fermacol']},{id:'diego',name:'Diego Molina',zone:'Sierra · Distribución',companies:['Akabados','Fermacol']},{id:'sofia',name:'Sofía Vargas',zone:'Ambato · Ferretería',companies:['Fermacol']}];
let activeAgent=null,activeCompany=null;
const originalRender=render,originalHome=homeApp,originalStore=storeOrder,originalOrdersApp=ordersApp;
const contextKey=()=>activeAgent&&activeCompany?'ak-app-v3-'+activeAgent.id+'-'+activeCompany:null;
function save(){const k=contextKey();if(k)localStorage.setItem(k,JSON.stringify({cart,orders,clientId,warehouse,discount,deliveryData}));}
function loadContext(){const k=contextKey();let state={};try{state=JSON.parse(localStorage.getItem(k)||'{}')}catch{}cart=state.cart||[];orders=state.orders||[];clientId=state.clientId||1;warehouse=state.warehouse||0;discount=state.discount||0;deliveryData=state.deliveryData||{method:'Despacho a dirección del cliente',address:client().address,note:''};brand=activeCompany;category='Todos';query='';mode='Vendedor';lastOrder=null;}
function loginApp(){return '<div class="loginBrand"><span>a.</span><small>AKABADOS × GRUPO FERMACOL</small></div><div class="appIntro"><div class="eyebrow">VENTAS EN MOVIMIENTO</div><h1>Tu próxima venta<br>empieza contigo.</h1><p>Ingresa como asesor para continuar con tu cartera y tus pedidos.</p></div><div class="panel"><label for="agentLogin">Agente comercial de demostración</label><select id="agentLogin">'+salesAgents.map(a=>'<option value="'+a.id+'">'+a.name+' · '+a.zone+'</option>').join('')+'</select><label for="demoCode">Código de acceso de prueba</label><input id="demoCode" type="password" autocomplete="off" value="DEMO2026" aria-describedby="codeHelp"><p id="codeHelp" class="tiny">Código público para probar: <b>DEMO2026</b>. No ingreses tu contraseña real.</p><button class="btn full" style="margin-top:16px" onclick="loginAgent()">Ingresar a la app →</button></div><div class="loginNote"><b>Una cuenta para cada vendedor</b><p>Empresa activa, catálogo y pedidos separados por contexto comercial.</p></div><p class="tiny">Acceso simulado. Los agentes son ficticios y los datos solo se guardan en este navegador. No hay autenticación real.</p>'}
function loginAgent(){if(document.getElementById('demoCode').value!=='DEMO2026'){toast('Para probar utiliza el código público DEMO2026.');return}activeAgent=salesAgents.find(a=>a.id===document.getElementById('agentLogin').value);activeCompany=null;cart=[];orders=[];go('company')}
function companyApp(){return '<div class="appIntro"><div class="eyebrow">HOLA, '+escapeHTML(activeAgent.name.toUpperCase())+'</div><h1>¿Con qué empresa<br>vas a vender?</h1><p>El catálogo y los pedidos se cargarán para la empresa seleccionada.</p></div><div class="companyChoices">'+activeAgent.companies.map(c=>'<button class="companyCard '+(c==='Fermacol'?'fermacol':'')+'" onclick="selectCompany(\''+c+'\')"><span class="companySymbol">'+(c==='Akabados'?'a.':'F')+'</span><small>EMPRESA COMERCIAL</small><h2>'+c+'</h2><p>'+(c==='Akabados'?'Acabados, porcelanatos y baños':'Ferretería y materiales de construcción')+'</p><strong>Entrar a '+c+' →</strong></button>').join('')+'</div><p class="tiny">Empresas habilitadas para '+activeAgent.name+'. Asignaciones ilustrativas; la estructura legal y permisos se definirán con el cliente.</p><button class="appText" onclick="logoutAgent()">← Cambiar agente</button>'}
function selectCompany(c){if(!activeAgent?.companies.includes(c)){toast('Empresa no habilitada para este agente.');return}save();activeCompany=c;loadContext();go('home')}
function switchCompany(){save();go('company')}
function logoutAgent(){save();activeAgent=null;activeCompany=null;cart=[];orders=[];go('login')}
const originalGo=go;go=function(s){if(!activeAgent)s='login';else if(!activeCompany&&s!=='company')s='company';originalGo(s)};
const originalTop=topApp;topApp=function(){if(appScreen==='login')return '<div class="appStatus"><b>9:41</b><span>DEMO · ▮▮▮ ▰</span></div>';if(appScreen==='company')return '<div class="appStatus"><b>9:41</b><span>DEMO · ▮▮▮ ▰</span></div><div class="appBar"><button aria-label="Volver al ingreso" onclick="logoutAgent()">←</button><div><small>ACCESO COMERCIAL</small><h2>Seleccionar empresa</h2></div></div>';return originalTop()+'<div class="activeContext"><button onclick="switchCompany()"><b>'+activeCompany+' ⌄</b><small>Empresa activa</small></button><div><b>'+activeAgent.name+'</b><small>'+activeAgent.zone+'</small></div><button class="logout" aria-label="Cerrar sesión" onclick="logoutAgent()">↪</button></div>'};
const originalBottom=bottomApp;bottomApp=function(){return ['login','company'].includes(appScreen)?'':originalBottom()};
homeApp=function(){let html=originalHome();return html.replace('HOLA, EQUIPO COMERCIAL','HOLA, '+activeAgent.name.toUpperCase()).replace('Una nueva visita.<br>Una gran oportunidad.',activeCompany+'.<br>Tu próxima oportunidad.').replace('<b>'+orders.length+'</b>','<b>'+orders.length+'</b>')};
storeOrder=function(status,extra={}){return originalStore(status,{...extra,agentId:activeAgent.id,agentName:activeAgent.name,company:activeCompany})};
const originalRenderProducts=renderProducts;renderProducts=function(){brand=activeCompany;originalRenderProducts()};
const originalCatalogApp=catalogApp;catalogApp=function(){let html=originalCatalogApp();html=html.replace(/<select class="appBrand"[\s\S]*?<\/select>/,'<span class="pill">'+activeCompany+'</span>');return html};
const originalAdd=addFromDetail;addFromDetail=function(id){if(pby(id).brand!==activeCompany){toast('Este producto pertenece a otra empresa.');return}originalAdd(id)};
settings=function(){openModal('<div class="eyebrow">CONTEXTO DE VENTA</div><h2>'+activeCompany+'</h2><p>'+activeAgent.name+' · '+activeAgent.zone+'</p><button class="btn light full" onclick="closeModal();switchCompany()">Cambiar empresa</button><label for="warehouse">Bodega de despacho · demo</label><select id="warehouse"><option value="0" '+(!warehouse?'selected':'')+'>Primera Imprenta</option><option value="1" '+(warehouse?'selected':'')+'>Izamba</option></select><label for="discount">Descuento adicional solicitado (%)</label><input id="discount" type="number" min="0" max="30" value="'+discount+'"><p class="tiny">Más de 5% requiere aprobación simulada.</p><label for="network">Conectividad simulada</label><select id="network"><option value="on" '+(online?'selected':'')+'>En línea</option><option value="off" '+(!online?'selected':'')+'>Sin conexión · borradores</option></select><button class="btn full" style="margin-top:20px" onclick="applySettings()">Aplicar configuración</button><button class="appText" onclick="closeModal();logoutAgent()">Cerrar sesión / cambiar vendedor</button><p class="tiny">Demo local. Sin conexión o autenticación real en Odoo.</p>',true)};
applySettings=function(){let d=Number(document.getElementById('discount').value);if(!Number.isFinite(d)||d<0||d>30){toast('Ingresa un descuento entre 0 y 30%.');return}warehouse=Number(document.getElementById('warehouse').value);discount=d;online=document.getElementById('network').value==='on';save();closeModal();render();toast('Configuración actualizada')};
const originalOrderDetail=orderDetail;orderDetail=function(i){if(!orders[i]||orders[i].agentId!==activeAgent.id||orders[i].company!==activeCompany)return;originalOrderDetail(i);let title=document.querySelector('.modal .eyebrow');if(title)title.textContent=activeCompany+' · '+activeAgent.name+' · COMPROBANTE DEMO'};
ordersApp=function(){return originalOrdersApp().replace('Retoma una oportunidad o repite una venta.',activeCompany+' · Pedidos de '+activeAgent.name+'.')};
render=function(){if(appScreen==='login'||appScreen==='company'){document.getElementById('app').innerHTML=topApp()+'<div class="appPage accessPage">'+(appScreen==='login'?loginApp():companyApp())+'</div>';return}originalRender()};

let onlyAvailable=false;
const plural=p=>p.coverage?'cajas':({unidad:'unidades',saco:'sacos',bolsa:'bolsas',galón:'galones',kit:'kits'}[p.unit]||p.unit);
homeApp=function(){return '<div class="appIntro"><h1>Ventas</h1><p>'+activeCompany+' · '+activeAgent.name+'</p></div><button class="btn full" onclick="go(\'clients\')">+ Nuevo pedido</button>'+(cart.length?'<button class="btn light full" style="margin-top:12px" onclick="go(\'catalog\')">Continuar pedido · '+money(totals().total)+'</button>':'')+'<div class="appQuick"><button onclick="go(\'orders\')"><b>'+orders.length+'</b><span>Mis pedidos →</span></button><button onclick="go(\'clients\')"><b>'+clients.length+'</b><span>Clientes →</span></button></div>'};

catalogApp=function(){let cats=['Todos',...new Set(products.filter(p=>p.brand===activeCompany).map(p=>p.cat))];return '<div class="fastClient"><div><b>'+client().name+'</b><small>'+client().type+' · '+client().term+'</small></div><button onclick="go(\'clients\')">Cambiar</button></div><input id="search" aria-label="Buscar productos" placeholder="Buscar por nombre o código" value="'+escapeHTML(query)+'" oninput="query=this.value;renderProducts()"><div class="fastFilters"><select aria-label="Categoría" onchange="category=this.value;renderProducts()">'+cats.map(c=>'<option '+(category===c?'selected':'')+'>'+c+'</option>').join('')+'</select><label><input type="checkbox" '+(onlyAvailable?'checked':'')+' onchange="onlyAvailable=this.checked;renderProducts()"> Con stock</label></div><div class="sectionTitle"><small id="resultCount"></small><button class="appText" onclick="settings()">'+(warehouse?'Izamba':'Primera Imprenta')+' ⌄</button></div><div id="products" class="fastProducts"></div><div id="fastCartBar">'+fastBar()+'</div>'};
function fastBar(){return appAction(cart.length?'Ver pedido · '+cart.length+' ref. · '+money(totals().total)+' →':'Agrega productos al pedido','go(\'bag\')',!cart.length)}
renderProducts=function(){let list=products.filter(p=>p.brand===activeCompany&&(category==='Todos'||p.cat===category)&&(!onlyAvailable||p.stock[warehouse]>0)&&(p.name+' '+p.spec+' '+p.sku).toLowerCase().includes(query.toLowerCase()));document.getElementById('resultCount').textContent=list.length+' productos · sin IVA';document.getElementById('products').innerHTML=list.map(p=>{let qty=cart.find(l=>l.id===p.id)?.qty||0;return '<article class="fastProduct">'+visual(p)+'<div class="fastProductBody"><button class="productName" onclick="detail('+p.id+')">'+p.name+'</button><small>'+p.spec+'</small><small>'+p.sku+'</small><div class="stock '+(!p.stock[warehouse]?'none':'')+'">'+(p.stock[warehouse]?p.stock[warehouse]+' '+plural(p)+' disponibles':'Sin stock')+'</div><div class="fastPrice"><b>'+money(price(p))+'<small> / '+p.unit+'</small></b><span>'+ (p.coverage?money(price(p)*p.coverage)+' / caja':'')+'</span></div><div class="fastQuantity"><div class="qty"><button aria-label="Restar '+p.name+'" onclick="setFastQty('+p.id+','+Math.max(0,qty-1)+')" '+(!qty?'disabled':'')+'>−</button><input aria-label="Cantidad '+p.name+'" type="number" min="0" step="1" inputmode="numeric" value="'+qty+'" onchange="setFastQty('+p.id+',Number(this.value))"><button aria-label="Sumar '+p.name+'" onclick="setFastQty('+p.id+','+(qty+1)+')" '+(online&&qty>=p.stock[warehouse]?'disabled':'')+'>+</button></div><small>'+plural(p)+'</small>'+(p.coverage?'<button class="calcLink" onclick="detail('+p.id+')">Calcular m²</button>':'')+'</div></div></article>'}).join('')||'<div class="empty">No hay productos para estos filtros.</div>';let bar=document.getElementById('fastCartBar');if(bar)bar.innerHTML=fastBar()};
function setFastQty(id,q){let p=pby(id);if(p.brand!==activeCompany||!Number.isInteger(q)||q<0){toast('Ingresa una cantidad entera válida.');renderProducts();return}if(online&&q>p.stock[warehouse]){toast('Disponible: '+p.stock[warehouse]+' '+plural(p)+'.');renderProducts();return}cart=cart.filter(l=>l.id!==id);if(q)cart.push({id,qty:q});save();renderProducts();let nav=document.querySelector('.appBottom');if(nav)nav.outerHTML=bottomApp()}
bagApp=function(){if(!cart.length)return '<div class="empty">Tu pedido está vacío.</div><button class="btn full" onclick="go(\'catalog\')">Agregar productos</button>';let t=totals();return '<div class="fastClient"><div><b>'+client().name+'</b><small>'+client().term+'</small></div><button onclick="go(\'clients\')">Cambiar</button></div><div class="panel">'+cart.map(l=>{let p=pby(l.id);return '<div class="fastBagLine"><div><b>'+p.name+'</b><small>'+l.qty+' '+plural(p)+(p.coverage?' · '+(l.qty*p.coverage).toFixed(2)+' m²':'')+'</small></div><b>'+money(lineTotal(l))+'</b><div class="qty"><button aria-label="Restar '+p.name+'" onclick="quantity('+p.id+',-1)">−</button><span>'+l.qty+'</span><button aria-label="Sumar '+p.name+'" onclick="quantity('+p.id+',1)">+</button></div><button class="remove" aria-label="Eliminar '+p.name+'" onclick="removeLine('+p.id+')">Eliminar</button></div>'}).join('')+'<button class="appText" onclick="go(\'catalog\')">+ Agregar productos</button></div><div class="panel" style="margin-top:14px"><h3>Entrega</h3><label for="appDelivery">Modalidad</label><select id="appDelivery"><option '+(deliveryData.method==='Despacho a dirección del cliente'?'selected':'')+'>Despacho a dirección del cliente</option><option '+(deliveryData.method==='Retiro en bodega'?'selected':'')+'>Retiro en bodega</option></select><label for="appAddress">Dirección o referencia</label><input id="appAddress" maxlength="200" value="'+escapeHTML(deliveryData.address||client().address)+'"><details><summary>Agregar observaciones</summary><textarea id="appNote" maxlength="500" rows="2" placeholder="Indicaciones de entrega">'+escapeHTML(deliveryData.note)+'</textarea></details></div><div class="panel" style="margin-top:14px"><div class="totalRow"><span>Subtotal</span><b>'+money(t.sub)+'</b></div>'+(discount?'<div class="totalRow"><span>Descuento '+discount+'%</span><b>−'+money(t.disc)+'</b></div>':'')+'<div class="totalRow"><span>IVA 15% · demo</span><b>'+money(t.vat)+'</b></div><div class="totalRow big"><span>Total</span><b>'+money(t.total)+'</b></div>'+(client().type==='B2B'?'<small>Cupo disponible: '+money(client().credit-client().balance)+'</small>':'')+'<p class="tiny">Flete por confirmar. Pedido de demostración.</p></div><input id="appConflict" type="checkbox" hidden>'+appAction(online?'Enviar pedido · '+money(t.total)+' →':'Guardar sin conexión','fastSend()')+'<button class="appText" onclick="saveFastDraft()">Guardar como borrador</button>'};
function captureFastDelivery(){let a=document.getElementById('appAddress').value.trim();if(!a){toast('Completa la dirección o referencia.');return false}deliveryData={address:a,method:document.getElementById('appDelivery').value,note:document.getElementById('appNote').value.trim()};save();return true}
function fastSend(){if(captureFastDelivery())sendAppOrder()}
function saveFastDraft(){if(!captureFastDelivery())return;lastOrder=storeOrder('Borrador',{address:deliveryData.address,delivery:deliveryData.method,note:deliveryData.note});cart=[];save();go('orders');toast('Borrador guardado')}
resolveAppConflict=function(){let l=cart.find(x=>x.id===conflict.id);if(conflict.available)l.qty=conflict.available;else cart=cart.filter(x=>x.id!==conflict.id);save();closeModal();go('bag')};
const baseFastGo=go;go=function(s){if(['review','delivery'].includes(s))s='bag';if(s==='vision')s='home';baseFastGo(s)};
const fastRenderBase=render;render=function(){fastRenderBase();if(!['login','company'].includes(appScreen)){let hint=document.createElement('div');hint.className='demoFoot';hint.textContent='Demo · datos ficticios · sin conexión real a Odoo';document.getElementById('app').appendChild(hint)}};

activeAgent=null;activeCompany=null;appScreen='login';cart=[];orders=[];render();

</script></body></html>
